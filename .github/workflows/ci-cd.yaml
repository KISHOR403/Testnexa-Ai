# ================================================
# Testnexa AI - CI/CD Pipeline (GitHub Actions)
# ================================================
# This pipeline builds Docker images, pushes to DockerHub,
# and optionally deploys to Kubernetes.
#
# Required GitHub Secrets:
#   - DOCKERHUB_USERNAME: Your DockerHub username
#   - DOCKERHUB_TOKEN:    Your DockerHub access token
# ================================================

name: Testnexa AI CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BACKEND_IMAGE: ${{ (secrets.DOCKERHUB_USERNAME || 'local') }}/testnexa-backend
  FRONTEND_IMAGE: ${{ (secrets.DOCKERHUB_USERNAME || 'local') }}/testnexa-frontend

jobs:
  # ---- Build & Push Backend ----
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.event_name == 'push' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- Build & Push Frontend ----
  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.event_name == 'push' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=http://testnexa-backend-service:5000/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- Deploy to Kubernetes (Manual trigger or push to main) ----
  deploy:
    name: Deploy to Kubernetes
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Kubernetes
        run: |
          echo "========================================="
          echo "  Deployment Instructions"
          echo "========================================="
          echo ""
          echo "To deploy manually to Minikube, run:"
          echo ""
          echo "  kubectl apply -f k8s/namespace.yaml"
          echo "  kubectl apply -f k8s/configmap.yaml"
          echo "  kubectl apply -f k8s/secret.yaml"
          echo "  kubectl apply -f k8s/nginx-configmap.yaml"
          echo "  kubectl apply -f k8s/backend-deployment.yaml"
          echo "  kubectl apply -f k8s/backend-service.yaml"
          echo "  kubectl apply -f k8s/frontend-deployment.yaml"
          echo "  kubectl apply -f k8s/frontend-service.yaml"
          echo ""
          echo "For monitoring:"
          echo "  kubectl apply -f k8s/monitoring/"
          echo ""
          echo "========================================="
