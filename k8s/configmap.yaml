apiVersion: v1
kind: ConfigMap
metadata:
  name: testnexa-config
  namespace: testnexa
  labels:
    app.kubernetes.io/name: testnexa
    app.kubernetes.io/part-of: testnexa-ai
data:
  NODE_ENV: "production"
  PORT: "5000"
  AI_PROVIDER: "gemini"
  GEMINI_MODEL: "gemini-2.5-flash"
  GEMINI_MAX_TOKENS: "4000"
  GEMINI_TEMPERATURE: "0.7"
  OPENAI_MODEL: "gpt-3.5-turbo"
  OPENAI_MAX_TOKENS: "2000"
  OPENAI_TEMPERATURE: "0.7"
  AI_MAX_RETRIES: "3"
  AI_RETRY_DELAY: "1000"
  RATE_LIMIT_WINDOW: "15"
  RATE_LIMIT_MAX: "100"
  FRONTEND_URL: "http://testnexa-frontend-service:80"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
