apiVersion: v1
kind: Service
metadata:
  name: testnexa-frontend-service
  namespace: testnexa
  labels:
    app: testnexa-frontend
    app.kubernetes.io/name: testnexa-frontend
    app.kubernetes.io/part-of: testnexa-ai
    app.kubernetes.io/component: frontend
spec:
  type: LoadBalancer
  selector:
    app: testnexa-frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
